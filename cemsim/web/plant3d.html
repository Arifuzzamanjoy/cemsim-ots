<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CemSim 3D Plant</title>
<style>
  :root { --panel: rgba(18, 22, 28, .82); --ink: #e8ecf1; --muted: #9aa6b2; --val: #fbf5a6; --fault: #d62f2f; --run: #2fb34a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1116; color: var(--ink);
    font: 13px/1.35 "Segoe UI", Tahoma, Arial, sans-serif; }
  #view { position: fixed; inset: 0; }
  .hud { position: fixed; background: var(--panel); border: 1px solid #2c3440; border-radius: 6px; padding: 8px 10px;
    backdrop-filter: blur(4px); }
  #top { top: 10px; left: 10px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; max-width: calc(100% - 20px); }
  #top .brand { font-weight: 800; font-size: 16px; } #top .brand span { color: #e5484d; }
  #top .kv b { color: var(--val); font-size: 14px; }
  #conn { width: 10px; height: 10px; border-radius: 50%; background: #888; display: inline-block; }
  #conn.ok { background: var(--run); } #conn.bad { background: var(--fault); }
  #tools { top: 58px; left: 10px; display: flex; flex-direction: column; gap: 6px; }
  #tools .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button { background: #28313d; color: var(--ink); border: 1px solid #3b4756; border-radius: 4px; padding: 5px 9px;
    font: inherit; cursor: pointer; }
  button:hover { background: #33404f; } button.on { background: #2f6fb0; border-color: #4a8bd0; }
  #info { right: 10px; top: 58px; width: 290px; display: none; }
  #info h3 { margin: 0 0 6px; font-size: 14px; } #info table { width: 100%; border-collapse: collapse; }
  #info td { padding: 2px 0; border-bottom: 1px solid #2c3440; } #info td.v { text-align: right; color: var(--val); font-family: monospace; }
  #alarms { right: 10px; top: 10px; max-width: 46%; }
  #alarms div { background: var(--fault); color: #fff; padding: 3px 8px; margin-bottom: 2px; border-radius: 3px; font-weight: 600; }
  #legend { left: 10px; bottom: 10px; }
  #legend .bar { width: 220px; height: 10px; border-radius: 2px;
    background: linear-gradient(90deg, rgb(30,60,190), rgb(40,190,90) 35%, rgb(240,220,40) 60%, rgb(245,130,20) 80%, rgb(220,30,30)); }
  #legend .ticks { display: flex; justify-content: space-between; width: 220px; color: var(--muted); font-size: 11px; }
  #hint { right: 10px; bottom: 10px; color: var(--muted); font-size: 11px; }
  .tag { background: rgba(251, 245, 166, .95); color: #111; border: 1px solid #b8ae4a; border-radius: 2px; padding: 1px 5px;
    font: 11px/1.3 Arial, sans-serif; white-space: nowrap; pointer-events: none; }
  .tag b { font-weight: 700; } .tag.alarm { background: #ffb3b3; border-color: var(--fault); }
  .tag .n { color: #555; margin-right: 4px; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--muted); }
</style>
<script type="importmap">
  { "imports": { "three": "/static/vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="view"></div>
<div id="loading">Loading 3D plant ...</div>
<div id="top" class="hud">
  <span class="brand">Cem<span>Sim</span> 3D</span>
  <span id="conn" title="live connection"></span>
  <span class="kv">sim <b id="h-time">-</b></span>
  <span class="kv">BZ <b id="h-bz">-</b> °C</span>
  <span class="kv">free CaO <b id="h-fl">-</b> %</span>
  <span class="kv">clinker <b id="h-cli">-</b> t/h</span>
  <span class="kv">q <b id="h-q">-</b> kJ/kg</span>
  <span class="kv">kiln <b id="h-rpm">-</b> rpm</span>
</div>
<div id="tools" class="hud">
  <div class="row">
    <button data-cam="overview" class="on">Overview</button><button data-cam="tower">Preheater</button>
    <button data-cam="kiln">Kiln</button><button data-cam="burner">Burner / hood</button><button data-cam="cooler">Cooler</button>
  </div>
  <div class="row">
    <button id="t-thermal" class="on" title="colour equipment by live temperature">Thermal</button>
    <button id="t-xray" title="see bed and flame inside the kiln">X-ray kiln</button>
    <button id="t-labels" class="on">Labels</button>
    <button id="t-struct" class="on">Structure</button>
    <button id="t-rotate" title="auto-orbit">Orbit</button>
  </div>
</div>
<div id="alarms" class="hud" style="display:none"></div>
<div id="info" class="hud"></div>
<div id="legend" class="hud"><div>kiln shell scanner</div><div class="bar"></div>
  <div class="ticks"><span>150</span><span>225</span><span>300</span><span>375</span><span>450 °C</span></div></div>
<div id="hint" class="hud">drag: rotate · right-drag: pan · wheel: zoom · click equipment for live data</div>
<script type="module" src="/static/plant3d.js"></script>
</body>
</html>
