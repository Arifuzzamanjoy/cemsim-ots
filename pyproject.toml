[project]
name = "duosim"
version = "0.1.0"
description = "DuoSim: industrial simulation and AI design platform - first-principles cement kiln simulator, operator HMI, live 3-D plant and text / image / CAD to verified FreeCAD models."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Arifuzzaman Joy" }]
requires-python = ">=3.11"
keywords = ["cement", "rotary-kiln", "process-simulation", "operator-training", "digital-twin", "dcs", "hmi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "cryptography>=42",       # AES-GCM for workspace provider keys (bring-your-own-key)
]

[project.optional-dependencies]
# Claude as a design-by-prompt provider (Gemini needs no SDK: plain HTTPS)
ai = ["anthropic>=1.0"]

[project.urls]
Homepage = "https://github.com/Arifuzzamanjoy/cemsim-ots"
Issues = "https://github.com/Arifuzzamanjoy/cemsim-ots/issues"

[project.scripts]
duosim = "duosim.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "httpx>=0.27",            # FastAPI TestClient
]
e2e = [
    "playwright>=1.44",
    "websockets>=12",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["duosim"]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["duosim/web/vendor", "third_party"]
force-exclude = true  # also honoured when pre-commit passes files explicitly

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "SIM",       # simplify
    "C4",        # comprehensions
    "PIE",       # misc lints
    "RUF",       # ruff-specific
    "NPY",       # numpy
    "S",         # bandit security
]
ignore = [
    "E501",      # long lines are handled by the formatter; physics tables stay readable
    "E741",      # 'l' is a natural name in some formulae
    "S101",      # assert is used for design invariants
    "S311",      # random is for process noise, not crypto
    "S104",      # server binds 0.0.0.0 on purpose (training room / container)
    "RUF001", "RUF002", "RUF003",   # greek letters / degree signs in docstrings
    "SIM108",    # ternaries are not always clearer
    "B905",      # zip(strict=) not required
    "RUF012",    # mutable class attrs in dataclass-like constants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "SIM"]
"scripts/**" = ["S", "E402"]
"tools/freecad/**" = ["S", "E402"]

[tool.ruff.format]
quote-style = "double"

# ------------------------------------------------------------------ pytest / coverage
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::RuntimeWarning"]
markers = [
    "freecad: needs a real FreeCAD GUI + the FreeCAD-MCP addon (opt-in: pytest -m freecad tests/integration)",
    "llm: calls a real model API with your key and spends credits (opt-in: pytest -m llm)",
]

[tool.coverage.run]
source = ["duosim"]
omit = ["duosim/freecad_bridge.py", "duosim/freecad_worker.py"]  # exercised by the opt-in real-FreeCAD suite

[tool.coverage.report]
skip_empty = true
show_missing = false
