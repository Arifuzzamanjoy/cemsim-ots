# pre-commit install   ->  hooks run on every commit;  CI runs them on all files.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^cemsim/web/(vendor|assets)/
      - id: end-of-file-fixer
        exclude: ^cemsim/web/(vendor|assets)/|^data/snapshots/
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^cemsim/web/assets/
      - id: check-added-large-files
        args: ["--maxkb=1500"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^cemsim/web/vendor/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
