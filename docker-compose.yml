# DuoSim platform: app + one FreeCAD worker.
#
#   mkdir -p .duosim && python3 -c "import secrets; print(secrets.token_urlsafe(32))" > .duosim/freecad_token
#   cp .env.example .env            # add GEMINI_API_KEY and/or ANTHROPIC_API_KEY
#   docker compose up --build
#   docker compose exec app python -m duosim.platform keys create --workspace acme   # your API key
#
# Open http://localhost:8000/design (HMI at /, 3-D plant at /3d).
# Scale FreeCAD by adding more `freecad` services; one worker = one FreeCAD session.
services:
  freecad:
    build: { context: ., dockerfile: deploy/freecad-worker.Dockerfile }
    image: duosim-freecad
    secrets: [freecad_token]
    shm_size: "1gb"            # Qt / Mesa shared memory
    mem_limit: 2g              # a GUI worker is ~0.7 GB resident; designs add to it
    restart: unless-stopped
    networks: [backend]        # not published: only the app can reach the RPC port

  app:
    build: { context: ., dockerfile: deploy/app.Dockerfile }
    image: duosim-app
    depends_on:
      freecad: { condition: service_healthy }
    env_file: [.env]
    environment:
      DUOSIM_FREECAD_URL: freecad:9875
      FREECAD_MCP_TOKEN_FILE: /run/secrets/freecad_token
      DUOSIM_DATA_DIR: /data
    secrets: [freecad_token]
    volumes: [duosim-data:/data]
    ports: ["${DUOSIM_PORT:-8000}:8000"]
    restart: unless-stopped
    networks: [backend, default]

networks:
  backend: { internal: true }   # no route to the internet: FreeCAD runs model-influenced geometry only

secrets:
  freecad_token: { file: ./.duosim/freecad_token }

volumes:
  duosim-data:
