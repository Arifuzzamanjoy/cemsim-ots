name: FreeCAD integration

# Runs the opt-in `freecad` test marker against a *real* FreeCAD 1.1 GUI (virtual display) with the
# vendored FreeCAD-MCP addon and the upstream `freecad-mcp` MCP server.  Nothing is mocked.
# The live-model test (`llm` marker) is never run here: it spends credits.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "cemsim/freecad_*.py"
      - "cemsim/design/**"
      - "cemsim/api_design.py"
      - "third_party/**"
      - "tools/freecad/**"
      - "tests/integration/**"
      - ".github/workflows/freecad-integration.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FREECAD_VERSION: "1.1.4"
  # from FreeCAD_1.1.4-Linux-x86_64-py311.AppImage-SHA256.txt in the release
  FREECAD_SHA256: f6dc6ba676e5ac96a565ebc8d657232f94c6158e85b4352141bd1a46f6b43434

jobs:
  freecad:
    name: Real FreeCAD + addon + MCP server
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-xfixes0 libdbus-1-3
      - name: FreeCAD (checksum-verified AppImage, extracted - no FUSE needed)
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o fc.AppImage \
            "https://github.com/FreeCAD/FreeCAD/releases/download/${FREECAD_VERSION}/FreeCAD_${FREECAD_VERSION}-Linux-x86_64-py311.AppImage"
          echo "${FREECAD_SHA256}  fc.AppImage" | sha256sum -c -
          chmod +x fc.AppImage
          ./fc.AppImage --appimage-extract > /dev/null
          rm fc.AppImage
          echo "CEMSIM_FREECAD=${PWD}/squashfs-root" >> "${GITHUB_ENV}"
      - run: uv sync --group dev --group e2e
      - name: Integration suite (connection, security, MCP server, live model, design pipeline, faults)
        env:
          CEMSIM_WORKER_LOG_DIR: ${{ github.workspace }}/worker-logs
        run: uv run --no-sync pytest -m "freecad and not llm" tests/integration -v
      - name: Design Studio in a browser (real worker, headless Chromium, no model credits)
        run: |
          uv run --no-sync playwright install --with-deps chromium
          uv run --no-sync python tests/validation/e2e_design.py worker-logs/shots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: freecad-worker-logs
          path: worker-logs
          if-no-files-found: ignore
          retention-days: 14
